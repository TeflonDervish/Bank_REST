#
# application.yml — главный конфигурационный файл Spring Boot.

server:
    port: 8080

spring:
    application:
        name: bank_rest

    datasource:
        url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/bank_rest}
        username: server
        password: server
        driver-class-name: org.postgresql.Driver

    jpa:
        hibernate:
            ddl-auto: update
        §show-sql: true
        properties:
            hibernate:
                format_sql: true


springdoc:
    swagger-ui:
        path: /swagger-ui.html
        tags-sorter: alpha
        operations-sorter: alpha

jwt:
    signing:
        key: 53A73E5F1C4E0A2D3B5F2D784E6A1B423D6F247D1F6E5C3A596D635A75327855
        expiration-ms: 86400000


