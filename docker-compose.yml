services:

    bank-rest:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: bank-rest
        depends_on:
            postgresql:
                condition: service_healthy
        ports:
            - "8080:8080"
        environment:
            - DATABASE_URL=jdbc:postgresql://postgresql:5432/bank_rest
            - DATABASE_USERNAME=server
            - DATABASE_PASSWORD=server
        restart: unless-stopped
        networks:
            - bank-network

    postgresql:
        image: postgres:latest
        container_name: postgresql
        environment:
            POSTGRES_USER: server
            POSTGRES_PASSWORD: server
            POSTGRES_DB: bank_rest
        ports:
            - "5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
        networks:
            - bank-network


networks:
    bank-network:
        driver: bridge

volumes:
    postgres_data:


